name: Default

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      specifier:
        description: 'Explicit semver bump to force (e.g. major, minor, patch, 1.0.0). Leave empty to derive from conventional commits.'
        required: false
        type: string

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 12

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: 'pnpm'

      - run: pnpm i
      - run: echo ${{secrets.NPM_TOKEN}}

      - name: Build
        run: pnpm nx run-many -t build

      - name: Test
        run: pnpm nx run-many -t test

      - name: E2E
        run: pnpm nx e2e nx-plugin-openapi-e2e

  release:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 12

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'

      - run: pnpm i

      - name: Configure git author
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Release
        run: |
          pnpm nx run-many -t build
          pnpm nx release ${{ inputs.specifier && format('--specifier={0}', inputs.specifier) || '' }} -y
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: true
          NX_SKIP_NX_CACHE: true
